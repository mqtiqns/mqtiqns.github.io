<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MQTIQNS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
}

.sidebar{
    width:220px;
    padding:40px;
    position:fixed;
    height:100vh;
}

.sidebar h1{
    font-size:18px;
    margin-bottom:25px;
    letter-spacing:2px;
}

.sidebar p{
    margin-bottom:10px;
}

.sidebar a{
    color:#999;
    text-decoration:none;
}

.sidebar a:hover{
    color:white;
}

.gallery{
    margin-left:260px;
    padding:50px;
    width:100%;
}

.gallery video{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    cursor:pointer;
    display:block;
    transition:.3s;
}

.gallery video:hover{
    opacity:.8;
}

.lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.lightbox video{
    max-width:90%;
    max-height:90%;
}

@media (max-width:768px){

    body{
        flex-direction:column;
    }

    .sidebar{
        position:static;
        width:100%;
        height:auto;
        padding:25px;
    }

    .gallery{
        margin-left:0;
        padding:25px;
    }

}

</style>
</head>

<body>

<div class="sidebar">

    <h1>
        <a href="index.html">MQTIQNS</a>
    </h1>

    <p>
        <a href="animations.html">Animations</a>
    </p>

    <p>
        <a href="illustrations.html">Illustrations</a>
    </p>

</div>

<div class="gallery">

<video autoplay muted loop playsinline onclick="openVideo('videos/a1.mp4')">
    <source src="videos/a1.mp4" type="video/mp4">
</video>

</div>

<div class="lightbox" id="lightbox" onclick="closeVideo()">
    <video id="player" controls autoplay loop></video>
</div>

<script>

function openVideo(src){
    const box=document.getElementById("lightbox");
    const player=document.getElementById("player");

    player.src=src;
    box.style.display="flex";
    player.play();
}

function closeVideo(){
    const box=document.getElementById("lightbox");
    const player=document.getElementById("player");

    player.pause();
    box.style.display="none";
}

</script>

</body>
</html>
