<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTIQNS</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#111;
            color:white;
            font-family:Arial, sans-serif;
            display:flex;
        }

        .sidebar{
            width:220px;
            padding:40px;
            position:fixed;
            height:100vh;
            z-index:2;
        }

        .sidebar h1{
            font-size:18px;
            margin-bottom:25px;
            letter-spacing:2px;
        }

        .sidebar p{
            margin-bottom:10px;
        }

        .sidebar a{
            color:#999;
            text-decoration:none;
        }

        .sidebar a:hover{
            color:white;
        }

        .email{
            position:absolute;
            bottom:40px;
            color:#999;
            font-size:14px;
        }

        /* the big image on the right */
        .hero{
            position:fixed;
            top:0;
            right:0;
            bottom:0;
            left:260px;
            display:flex;
            justify-content:flex-end;
            align-items:flex-end;
            pointer-events:none;
        }

        .hero img{
            max-width:100%;
            max-height:100%;
            object-fit:contain;
            object-position:right bottom;
        }

        @media (max-width: 768px){

            body{
                flex-direction:column;
            }

            .sidebar{
                position:static;
                width:100%;
                height:auto;
                padding:25px;
            }

            .email{
                position:static;
                margin-top:30px;
            }

            .hero{
                position:static;
                width:100%;
            }

            .hero img{
                width:100%;
                height:auto;
            }

        }
    </style>
</head>

<body>

<div class="sidebar">

    <h1>MQTIQNS</h1>

    <p>
        <a href="animations.html">Animations</a>
    </p>

    <p>
        <a href="illustrations.html">Illustrations</a>
    </p>

    <div class="email">
        contact@mqtiqns.com
    </div>

</div>

<div class="hero">
    <img src="images/background.png" alt="MQTIQNS artwork">
</div>

</body>
</html>
