<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTIQNS</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#111;
            color:white;
            font-family:Arial, sans-serif;
            display:flex;
            overflow-x:hidden;
        }

        .sidebar{
            width:220px;
            padding:40px;
            position:fixed;
            height:100vh;
            z-index:2;
        }

        .sidebar h1{
            font-size:18px;
            margin-bottom:25px;
            letter-spacing:2px;
        }

        .sidebar p{
            margin-bottom:10px;
        }

        .sidebar a{
            color:#999;
            text-decoration:none;
        }

        .sidebar a:hover{
            color:white;
        }

        .email{
            position:absolute;
            bottom:40px;
            color:#999;
            font-size:14px;
        }

        /* jellyfish: centered in the space to the right of the menu */
        .hero{
            position:fixed;
            top:0;
            right:0;
            bottom:0;
            left:260px;
            display:flex;
            justify-content:center;
            align-items:center;
            pointer-events:none;
            overflow:hidden;
        }

        .hero img{
            height:106%;
            max-width:100%;
            object-fit:contain;
            object-position:center;
            animation:drift 9s ease-in-out infinite;
        }

        @keyframes drift{
            0%,100%{ transform:translate(0,0) rotate(0deg); }
            25%{ transform:translate(6px,-8px) rotate(0.4deg); }
            50%{ transform:translate(0,-14px) rotate(0deg); }
            75%{ transform:translate(-6px,-6px) rotate(-0.4deg); }
        }

        @media (prefers-reduced-motion: reduce){
            .hero img{
                animation:none;
            }
        }

        @media (max-width: 768px){

            body{
                flex-direction:column;
            }

            .sidebar{
                position:static;
                width:100%;
                height:auto;
                padding:25px;
            }

            .email{
                position:static;
                margin-top:30px;
            }

            .hero{
                position:static;
                width:100%;
                overflow:visible;
            }

            .hero img{
                width:100%;
                height:auto;
                max-width:100%;
            }

        }
    </style>
</head>

<body>

<div class="sidebar">

    <h1>MQTIQNS</h1>

    <p>
        <a href="animations.html">Animations</a>
    </p>

    <p>
        <a href="illustrations.html">Illustrations</a>
    </p>

    <div class="email">
        contact@mqtiqns.com
    </div>

</div>

<div class="hero">
    <img src="images/background.png" alt="MQTIQNS artwork">
</div>

</body>
</html>
